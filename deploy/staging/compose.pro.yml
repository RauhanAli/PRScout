# The optional paid-features service, next to the staging stack.
#
# preview.sh runs it when ~/projects/prscout-pro exists (a private repository;
# without it staging runs with paid features off). It is its own compose
# project, stage-prscout-pro, NOT a service in compose.yml: the staging stack
# is brought up with --remove-orphans and is public, this service is not.
# It joins stage-prscout-new's network as `pro`, so the staging server reaches
# it at http://pro:8000, and publishes no port.
#
# From the environment (preview.sh sets them):
#   PRSCOUT_PRO_SRC      the dedicated clone to build from (its origin/main)
#   PRSCOUT_PRO_KEY      STAGING_PRSCOUT_PRO_KEY from ~/.config/prscout/secrets.env
#   PRSCOUT_PRO_MODEL_*  OPENAI_API_KEY from the same file, provider openai,
#                     gpt-5-mini. Its spend counts against the staging
#                     server's budget (PRSCOUT_AI_BUDGET_USD): only the server's
#                     jobs call this service, and each holds its cost first.
#   PRSCOUT_DB_PASSWORD  from staging/.env; the database is prscout_pro in the
#                     staging Postgres (deploy/README.md, "Paid features")
#   GITHUB_TOKENS     the staging server's tokens; prscout-pro reads GitHub with
#                     the first. Empty when staging reads GitHub as its own
#                     GitHub App, and then prscout-pro can't read evidence (it
#                     has no app support yet).
#
#   docker compose -p stage-prscout-pro -f deploy/staging/compose.pro.yml \
#     --env-file deploy/staging/.env up -d --build
services:
  pro:
    build:
      context: ${PRSCOUT_PRO_SRC:?set PRSCOUT_PRO_SRC to the prscout-pro checkout to build}
      labels:
        prscout.stage: prscout-new
    image: stage-prscout-pro:latest
    labels:
      prscout.stage: prscout-new
    environment:
      PRSCOUT_PRO_ENV: production
      PRSCOUT_PRO_KEY: ${PRSCOUT_PRO_KEY:?STAGING_PRSCOUT_PRO_KEY in ~/.config/prscout/secrets.env (preview.sh maps it)}
      DATABASE_URL: postgresql+asyncpg://prscout:${PRSCOUT_DB_PASSWORD:?pass --env-file deploy/staging/.env}@db:5432/prscout_pro
      PRSCOUT_PRO_MODEL_KEY: ${PRSCOUT_PRO_MODEL_KEY:-}
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
      PRSCOUT_PRO_MODEL_PROVIDER: ${PRSCOUT_PRO_MODEL_PROVIDER:-openrouter}
      PRSCOUT_PRO_PLAYBOOK_MODEL: ${PRSCOUT_PRO_PLAYBOOK_MODEL:-openai/gpt-5-mini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      stage:
        aliases: [pro]
    mem_limit: 256m
    restart: unless-stopped

networks:
  stage:
    name: ${PRSCOUT_STAGE_NETWORK:-stage-prscout-new_default}
    external: true
